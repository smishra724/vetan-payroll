<title>Vetan Payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed ledger-green sidebar + scrolling work area; sidebar becomes a drawer under 900px */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EDF2EF; --line:#DAE2DD; --fg:#13201C; --muted:#53635C;
  --side:#0F2B26; --side-2:#163A33; --side-fg:#C5D6CF; --side-dim:#8FA79E; --side-active:#1E4D42;
  --accent:#1B6A55; --accent-hover:#145442; --accent-fg:#FFFFFF; --accent-soft:#E2F0EA;
  --mari:#9A5B00; --mari-bg:#FFF3DC; --mari-line:#F0D29A; --mari-dot:#E39A1B;
  --ok:#17663F; --ok-bg:#E1F3E8; --bad:#AF2318; --bad-bg:#FCE9E7; --info:#22508F; --info-bg:#E6EEF9; --plum:#6B3A8C; --plum-bg:#F1E8F7;
  --shadow:0 1px 2px rgba(15,43,38,.06),0 4px 14px rgba(15,43,38,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141E1B; --surface-2:#1A2622; --line:#283631; --fg:#E6EEEA; --muted:#9AADA5;
  --side:#09171A; --side-2:#10252A; --side-fg:#B8CBC4; --side-dim:#7D948C; --side-active:#173D35;
  --accent:#4DB592; --accent-hover:#63C7A4; --accent-fg:#05201A; --accent-soft:#16312A;
  --mari:#F2B04A; --mari-bg:#2B2213; --mari-line:#5A4422; --mari-dot:#F2B04A;
  --ok:#62D095; --ok-bg:#12291D; --bad:#F38B80; --bad-bg:#341719; --info:#8FB5EF; --info-bg:#15223A; --plum:#CDA2EE; --plum-bg:#2A1C35;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141E1B; --surface-2:#1A2622; --line:#283631; --fg:#E6EEEA; --muted:#9AADA5;
  --side:#09171A; --side-2:#10252A; --side-fg:#B8CBC4; --side-dim:#7D948C; --side-active:#173D35;
  --accent:#4DB592; --accent-hover:#63C7A4; --accent-fg:#05201A; --accent-soft:#16312A;
  --mari:#F2B04A; --mari-bg:#2B2213; --mari-line:#5A4422; --mari-dot:#F2B04A;
  --ok:#62D095; --ok-bg:#12291D; --bad:#F38B80; --bad-bg:#341719; --info:#8FB5EF; --info-bg:#15223A; --plum:#CDA2EE; --plum-bg:#2A1C35;
  --shadow:none; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800} h2{font-size:16px;font-weight:700} h3{font-size:14px;font-weight:700}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);padding-block:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:3px;padding:2px 8px}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;color:#fff;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--mari-dot)}
.brand span{font-size:12px;color:var(--side-dim);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#3DD68C;display:inline-block;flex:none}
.dot.off{background:#E39A1B}
.who{display:flex;gap:10px;align-items:center;background:var(--side-2);border-radius:10px;padding:10px 12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--side-active);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.who b{color:#fff;font-size:14px;display:block}
.who small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-dim)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 12px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:700}
.nav a[aria-current="page"] svg{color:var(--mari-dot)}
.nav .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-dim);padding:12px 12px 4px}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--mari-dot);color:#1d1300;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-dim);padding:0 8px}

.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{font-size:13px;color:var(--muted)} .crumb b{color:var(--fg);font-weight:600}
.top .sp{flex:1}
.menu-btn{display:none}
.view{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;display:flex;flex-direction:column;gap:18px}
.conn{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:7px 12px;border-radius:8px;background:var(--ok-bg);color:var(--ok)}
.conn.off{background:var(--mari-bg);color:var(--mari)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);color:var(--accent-fg)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.link{border:none;background:none;padding:0;min-height:0;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card.warn{background:var(--mari-bg);border-color:var(--mari-line)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.card-h small{color:var(--muted);font-size:12px}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cols>.wide{flex:3 1 440px;min-width:0;display:flex;flex-direction:column;gap:18px}
.cols>.narrow{flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--mari)} .kpi.bad b{color:var(--bad)}

.hero{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--mari-line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.hero.done{border-color:var(--line)}
.hero>div{flex:1 1 320px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.hero>div+div{border-left:1px solid var(--line)}
.hero .big{font-family:var(--f-display);font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mari)}
.stat.ok{color:var(--ok)} .stat .dot{background:var(--mari-dot)} .stat.ok .dot{background:var(--ok)}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;align-content:center}
.quad small{font-size:12px;color:var(--muted);font-weight:600;display:block}
.quad b{font-family:var(--f-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.quad span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px}

.list>div{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:none}
.date{width:42px;text-align:center;flex:none}
.date b{display:block;font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1}
.date small{font-size:11px;color:var(--muted)}
.grow{flex:1;min-width:0}
.grow b{display:block}
.right{text-align:right}
.icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.icon.w{background:var(--mari-bg);color:var(--mari)}
.icon svg{width:16px;height:16px}

.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:800;background:var(--surface-2)}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl tr.inactive td{opacity:.55}
.tbl input.cell{width:92px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--mari-bg);color:var(--mari)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.plum{background:var(--plum-bg);color:var(--plum)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.input{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface);min-height:40px;width:100%}
.field textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.field .hint{font-size:12px;color:var(--muted)}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fsec{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 -2px;grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .input{width:auto;flex:1 1 220px}
.toolbar select.input{flex:0 1 200px}

.att-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.att{border-collapse:collapse;font-size:12px}
.att th,.att td{border-top:1px solid var(--line);padding:0;text-align:center}
.att th{background:var(--surface-2);font-weight:700;padding:6px 0;min-width:34px;font-size:11px}
.att th small{display:block;font-weight:500;color:var(--muted)}
.att th.today{background:var(--accent);color:var(--accent-fg)} .att th.today small{color:var(--accent-fg)}
.att .who-c{text-align:left;padding:8px 12px;min-width:170px;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.att th.who-c{background:var(--surface-2)}
.att .who-c small{display:block;color:var(--muted)}
.att .sum{padding:6px 12px;text-align:right;white-space:nowrap;min-width:110px}
.att button.c{width:32px;height:30px;margin:2px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:11px;font-weight:700;cursor:pointer}
.att button.c:hover{border-color:var(--accent)}
.att button.c[disabled]{cursor:default}
.c-P{color:var(--ok)} .c-A{background:var(--bad-bg)!important;color:var(--bad)} .c-HD{background:var(--mari-bg)!important;color:var(--mari)}
.c-L{background:var(--info-bg)!important;color:var(--info)} .c-LW{background:var(--plum-bg)!important;color:var(--plum)} .c-WO,.c-NJ{color:var(--muted)} .c-H{background:var(--accent-soft)!important;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend b{display:inline-grid;place-items:center;min-width:26px;height:20px;border-radius:5px;font-size:10.5px;background:var(--surface-2)}

.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:15px}
.note{font-size:12.5px;padding:10px 12px;border-radius:8px;background:var(--info-bg);color:var(--info)}
.note.warn{background:var(--mari-bg);color:var(--mari)}

.modal{position:fixed;inset:0;background:rgba(6,18,15,.55);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.dialog.sm{width:min(460px,100%)}
.dialog header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dialog .body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dialog footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);width:36px;height:36px;border-radius:8px}
.x:hover{background:var(--surface-2)}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));right:max(18px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}

.slip{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slip .sh{padding:16px 18px;background:var(--surface-2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.slip .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;padding:14px 18px;font-size:13px}
.slip .meta small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.slip .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-top:1px solid var(--line)}
.slip .two>div{padding:12px 18px}
.slip .two>div+div{border-left:1px solid var(--line)}
.slip .ln{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.slip .ln.t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800}
.slip .net{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:14px 18px;background:var(--accent-soft);font-weight:700}
.slip .net b{font-family:var(--f-display);font-size:20px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rate{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.rate:first-of-type{border-top:none}
.rate b{font-variant-numeric:tabular-nums;text-align:right}

.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{flex:1 1 130px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.steps li b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg);font-size:11px;flex:none}
.steps li.cur{background:var(--accent-soft);color:var(--accent)} .steps li.cur b{background:var(--accent);color:var(--accent-fg)}
.steps li.done{color:var(--ok)} .steps li.done b{background:var(--ok);color:var(--surface)}
.docs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px}
.doc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.doc:first-child{border-top:none}
.doc>.grow>b{font-size:13.5px}
.file{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.file img,.file .pdf{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--surface-2)}
.file .pdf{display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--bad);background:var(--bad-bg)}
.file .grow{min-width:140px;word-break:break-word}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.warn-t{color:var(--mari);font-weight:600}
.ros th.n,.ros td.n{text-align:right}
.ros select{border:1px solid transparent;border-radius:6px;padding:6px 4px;font-size:12px;font-weight:700;min-width:104px;cursor:pointer}
.ros select:hover{border-color:var(--accent)}

<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>{const x=parseFloat(v);return isFinite(x)?x:0};
const inr=n=>(n<0?'−₹':'₹')+Math.round(Math.abs(n||0)).toLocaleString('en-IN');
const lakh=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(2)+' L':inr(n);
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ymOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const ymLabel=ym=>{const[y,m]=ym.split('-');return MON[+m-1]+' '+y};
const ymShift=(ym,k)=>{const[y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+k,1))};
const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const iso=(ym,d)=>ym+'-'+String(d).padStart(2,'0');
const fmtDate=s=>{if(!s)return '—';const d=new Date(s+'T00:00');return isNaN(d)?s:d.getDate()+' '+MON[d.getMonth()].slice(0,3)+' '+d.getFullYear()};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TODAY=new Date(); const CUR=ymOf(TODAY);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
function words(n){n=Math.round(n);if(n<=0)return 'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
 let s='';const cr=Math.floor(n/1e7);n%=1e7;const l=Math.floor(n/1e5);n%=1e5;const t=Math.floor(n/1e3);n%=1e3;
 if(cr)s+=three(cr)+' Crore ';if(l)s+=two(l)+' Lakh ';if(t)s+=two(t)+' Thousand ';if(n)s+=three(n);return s.trim()}
const ICON={
 dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 pay:'<rect x="2.5" y="6" width="19" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.5v6M18 9.5v6"/>',
 leaf:'<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14Z"/><path d="M5 19 13 11"/>',
 loan:'<path d="M3 10 12 4l9 6"/><path d="M5 10v9M19 10v9M9 10v9M15 10v9M3 21h18"/>',
 shield:'<path d="M12 3 4 6v6c0 4.5 3.4 7.8 8 9 4.6-1.2 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>',
 report:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/>',
 file:'<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8l-5-5Z"/><path d="M14 3v5h5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', play:'<path d="M7 4v16l13-8Z"/>', alert:'<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/>', up:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>'
};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ============ statutory rules ============ */
const PT_STATES={
 'Maharashtra':{fn:(g,m)=>g<=7500?0:g<=10000?175:(m===2?300:200),note:'Nil to ₹7,500 · ₹175 to ₹10,000 · ₹200 above (₹300 in Feb)'},
 'Karnataka':{fn:(g,m)=>g>=25000?(m===2?300:200):0,note:'₹200 from ₹25,000 gross (₹300 in Feb)'},
 'West Bengal':{fn:g=>g<=10000?0:g<=15000?110:g<=25000?130:g<=40000?150:200,note:'₹110 / ₹130 / ₹150 / ₹200 by slab above ₹10,000'},
 'Telangana':{fn:g=>g<=15000?0:g<=20000?150:200,note:'₹150 for ₹15,001–20,000 · ₹200 above'},
 'Andhra Pradesh':{fn:g=>g<=15000?0:g<=20000?150:200,note:'₹150 for ₹15,001–20,000 · ₹200 above'},
 'Gujarat':{fn:g=>g<12000?0:200,note:'₹200 from ₹12,000 gross'},
 'Delhi':{fn:()=>0,note:'No professional tax'},
 'Uttar Pradesh':{fn:()=>0,note:'No professional tax'},
 'Haryana':{fn:()=>0,note:'No professional tax'},
 'Rajasthan':{fn:()=>0,note:'No professional tax'},
 'Punjab':{fn:g=>g*12>250000?200:0,note:'₹200 when annual income exceeds ₹2.5 L'},
 'Other':{fn:()=>0,note:'Set a per-employee PT amount if your state levies it'}
};
const STATES=Object.keys(PT_STATES);
const DEFAULT_CFG={
 company:{name:'Your Company Pvt. Ltd.',state:'Delhi',address:'',pan:'',tan:'',pfCode:'',esiCode:''},
 admin:'HR Admin',
 pf:{ee:12,er:12,ceiling:15000},
 esi:{ee:0.75,er:3.25,limit:21000},
 tds:{std:75000,rebate:1200000,cess:4,slabs:[[400000,0],[800000,5],[1200000,10],[1600000,15],[2000000,20],[2400000,25],[0,30]]},
 structures:[{id:'std',name:'Standard',basic:50,hra:40,conv:1600},{id:'metro',name:'Metro (50% HRA)',basic:50,hra:50,conv:1600},{id:'contract',name:'Contract / Consultant',basic:100,hra:0,conv:0}],
 shifts:[{id:'gen',name:'General',start:'09:00',end:'18:00',brk:60},{id:'mor',name:'Morning',start:'06:00',end:'14:00',brk:30},{id:'eve',name:'Evening',start:'14:00',end:'22:00',brk:30},{id:'ngt',name:'Night',start:'22:00',end:'06:00',brk:30},{id:'full',name:'Full day',start:'00:00',end:'23:59',brk:0}],
 defaultShift:'gen'
};
const DOC_TYPES=[['photo','Passport-size photo',1],['pan','PAN card',1],['aadhaar','Aadhaar card',1],['bank','Cancelled cheque or bank proof',1],['address','Address proof',0],['edu','Education certificates',0],['exp','Experience or relieving letter',0],['offer','Signed offer letter',0],['other','Other documents',0]];
const REQ_DOCS=DOC_TYPES.filter(d=>d[2]).map(d=>d[0]);
const pendingDocs=e=>REQ_DOCS.filter(k=>!(e.docs||[]).some(d=>d.type===k));
const WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const OB_STEPS=['Personal details','Job & salary','Statutory & bank','Documents'];
const LEAVE_TYPES={CL:'Casual leave',SL:'Sick leave',EL:'Earned leave',LWP:'Leave without pay'};
const LOAN_TYPES=['Salary advance','Personal loan','Emergency loan','Education loan','Vehicle loan'];
const CODES={P:'Present',A:'Absent',HD:'Half day',L:'Paid leave',LW:'Leave w/o pay',WO:'Week off',H:'Holiday'};
const CYCLE=['P','A','HD','L','LW','H','WO'];

/* ============ state ============ */
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const S={db:null,dl:null,assets:null,live:false,canEdit:true,cfg:clone(DEFAULT_CFG),emps:{},att:{},runs:{},leaves:{},loans:{},filings:{},roster:{},
 loaded:{},route:'dashboard',month:CUR,ui:{q:'',loc:'',leaveTab:'all',reportMonth:CUR,attTab:'grid',week:isoD(mondayOf(TODAY))},inputs:{}};
function mergeCfg(c){const d=clone(DEFAULT_CFG);c=c||{};return {...d,...c,company:{...d.company,...(c.company||{})},pf:{...d.pf,...(c.pf||{})},esi:{...d.esi,...(c.esi||{})},tds:{...d.tds,...(c.tds||{})},structures:c.structures||d.structures,shifts:(c.shifts&&c.shifts.length)?c.shifts:d.shifts,defaultShift:c.defaultShift||d.defaultShift}}
const KEY={employees:'emps',attendance:'att',runs:'runs',leaves:'leaves',loans:'loans',filings:'filings',roster:'roster'};
const isAct=e=>!e.status||e.status==='active';
const obCount=()=>Object.values(S.emps).filter(e=>e.status==='onboarding').length;
async function put(col,id,data){
 if(col==='config')S.cfg=mergeCfg(data);else S[KEY[col]][id]=data;
 render();
 if(S.db){try{await S.db.doc(col+'/'+id).set(data)}catch(e){fail(e)}}
}
async function del(col,id){
 delete S[KEY[col]][id];render();
 if(S.db){try{await S.db.doc(col+'/'+id).delete()}catch(e){fail(e)}}
}
function fail(e){toast(e&&e.code==='invalid_argument'?'You have view-only access, so this change was not saved.':e&&e.code==='quota_exceeded'?'Storage is full. Delete old records to add more.':'Could not save: '+(e&&e.message||'try again'),'bad')}
let tT;function toast(m,k){const t=$('#toast');t.textContent=m;t.className='toast'+(k?' '+k:'');t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3200)}
async function download(filename,data){
 if(!S.dl){toast('Downloads are not available in this view.','bad');return}
 try{await S.dl.save({filename,data});toast('Saved '+filename)}catch(e){if(e&&e.code!=='declined')toast('Could not save the file: '+(e.message||e.code),'bad')}
}
const csv=rows=>rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');

/* ============ payroll engine ============ */
const fixedGross=e=>N(e.basic)+N(e.hra)+N(e.conv)+N(e.special);
const empList=()=>Object.entries(S.emps).map(([id,e])=>({...e,id})).sort((a,b)=>String(a.code).localeCompare(String(b.code),'en',{numeric:true}));
const activeIn=ym=>empList().filter(e=>isAct(e)&&(!e.doj||e.doj<=iso(ym,daysIn(ym))));
const weekOffOf=e=>e.weekOff===''||e.weekOff==null?0:+e.weekOff;
const shiftById=id=>S.cfg.shifts.find(s=>s.id===id);
const defShiftOf=e=>shiftById(e.shift)?e.shift:(shiftById(S.cfg.defaultShift)?S.cfg.defaultShift:S.cfg.shifts[0].id);
function rosterDefault(e,ym,d){const[y,mo]=ym.split('-').map(Number);return new Date(y,mo-1,d).getDay()===weekOffOf(e)?'OFF':defShiftOf(e)}
function rosterOf(e,ym,d){const r=S.roster[ym]&&S.roster[ym].a&&S.roster[ym].a[e.id];const v=r&&r[d];if(v==='OFF'||isCustom(v)||(v&&shiftById(v)))return v;return rosterDefault(e,ym,d)}
const fmt12=t=>{let[h,m]=String(t||'0:0').split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+String(m||0).padStart(2,'0')+' '+ap};
const isCustom=v=>/^T\d{4}-\d{4}$/.test(v||'');
const customOf=v=>({id:v,name:'Custom',start:v.slice(1,3)+':'+v.slice(3,5),end:v.slice(6,8)+':'+v.slice(8,10),brk:0});
const slotOf=v=>v==='OFF'?null:isCustom(v)?customOf(v):shiftById(v);
const numText=v=>{const s=slotOf(v);return s?s.start+'-'+s.end:'OFF'};
const slotText=v=>{const s=slotOf(v);return !s?'Week off':isCustom(v)?fmt12(s.start)+' - '+fmt12(s.end):s.name};
function timeVal(start,end){const hit=S.cfg.shifts.find(s=>s.start===start&&s.end===end);return hit?hit.id:'T'+start.replace(':','')+'-'+end.replace(':','')}
function parseTime(s){let x=String(s).trim().toLowerCase().replace(/\s+/g,'').replace(/\./g,':');if(/^\d{3,4}$/.test(x))x=x.slice(0,-2)+':'+x.slice(-2);const m=x.match(/^(\d{1,2})(?::(\d{2}))?(am|pm|a|p)?$/);if(!m)return null;let h=+m[1],mi=+(m[2]||0);const ap=m[3];
 if(ap){if(h<1||h>12)return null;h=h%12+(ap[0]==='p'?12:0)}if(h===24&&mi===0){h=23;mi=59}if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function parseRosterVal(raw){
 if(raw==null||typeof raw==='number')return null;const s=String(raw).trim(),l=s.toLowerCase();
 if(['off','wo','w/o','week off','weekly off','weekoff','rest','o'].includes(l))return 'OFF';
 const sh=S.cfg.shifts.find(x=>x.name.toLowerCase()===l||x.id===l);if(sh)return sh.id;
 const parts=s.split(/\s*(?:-|–|—|\bto\b)\s*/i);if(parts.length!==2)return null;
 const a=parseTime(parts[0]),b=parseTime(parts[1]);if(!a||!b||a===b)return null;return timeVal(a,b);
}
const baseCode=(e,ym,d)=>rosterOf(e,ym,d)==='OFF'?'WO':'P';
function code(e,ym,d){
 const k=iso(ym,d);if(e.doj&&k<e.doj)return 'NJ';
 const m=S.att[ym]&&S.att[ym].marks&&S.att[ym].marks[e.id];if(m&&m[d])return m[d];
 return baseCode(e,ym,d);
}
function shiftHours(s){if(!s)return 0;const p=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return h*60+(m||0)};let m=p(s.end)-p(s.start);if(m<=0)m+=1440;return Math.max(0,m-N(s.brk))/60}
function attSummary(e,ym){const D=daysIn(ym);let lop=0,c={};for(let d=1;d<=D;d++){const x=code(e,ym,d);c[x]=(c[x]||0)+1;if(x==='A'||x==='LW'||x==='NJ')lop+=1;else if(x==='HD')lop+=.5}return{D,lop,paid:D-lop,c}}
function annualTax(t){const c=S.cfg.tds;let tax=0,prev=0;for(const[upto,rate]of c.slabs){const top=N(upto)||Infinity;if(t>prev)tax+=(Math.min(t,top)-prev)*N(rate)/100;prev=top;if(t<=top)break}
 if(t<=N(c.rebate))tax=0;else tax=Math.min(tax,t-N(c.rebate));return Math.round(tax*(1+N(c.cess)/100))}
function monthlyTDS(e){if(e.tdsOverride!==''&&e.tdsOverride!=null)return N(e.tdsOverride);const t=fixedGross(e)*12-N(S.cfg.tds.std);return t>0?Math.round(annualTax(t)/12):0}
function ptFor(e,gross,ym){if(e.ptOverride!==''&&e.ptOverride!=null)return N(e.ptOverride);const r=PT_STATES[e.state]||PT_STATES.Other;return r.fn(gross,+ym.split('-')[1])}
function loansFor(e,ym){return Object.entries(S.loans).filter(([,l])=>l.empId===e.id&&l.status==='approved'&&N(l.balance)>0&&(l.start||'')<=ym&&!(l.paidMonths||[]).includes(ym)).map(([id,l])=>({id,amt:Math.min(N(l.emi),N(l.balance))}))}
function calc(e,ym,ex){
 ex=ex||{};const a=attSummary(e,ym),f=a.paid/a.D,c=S.cfg;
 const basic=Math.round(N(e.basic)*f),hra=Math.round(N(e.hra)*f),conv=Math.round(N(e.conv)*f),special=Math.round(N(e.special)*f),bonus=N(ex.bonus);
 const gross=basic+hra+conv+special+bonus,fg=fixedGross(e);
 const pfW=e.pf?Math.min(basic,N(c.pf.ceiling)):0,pfEE=Math.round(pfW*N(c.pf.ee)/100),pfER=Math.round(pfW*N(c.pf.er)/100),eps=Math.round(Math.min(pfW,15000)*.0833);
 const esiOn=fg>0&&fg<=N(c.esi.limit),esiEE=esiOn?Math.ceil(gross*N(c.esi.ee)/100):0,esiER=esiOn?Math.ceil(gross*N(c.esi.er)/100):0;
 const pt=gross>0?ptFor(e,gross,ym):0,tds=Math.min(monthlyTDS(e),Math.max(0,gross-pfEE-esiEE-pt));
 const loanParts=loansFor(e,ym),loan=loanParts.reduce((s,x)=>s+x.amt,0),other=N(ex.other);
 const ded=pfEE+esiEE+pt+tds+loan+other;
 return{empId:e.id,code:e.code,name:e.name,designation:e.designation||'',dept:e.dept||'',state:e.state||'',pan:e.pan||'',uan:e.uan||'',bankName:e.bankName||'',account:e.account||'',ifsc:e.ifsc||'',
  D:a.D,paid:a.paid,lop:a.lop,basic,hra,conv,special,bonus,gross,pfW,pfEE,pfER,eps,epfER:pfER-eps,esiEE,esiER,pt,tds,loan,loanParts,other,ded,net:gross-ded,ctc:gross+pfER+esiER}
}
function totals(rows){const t={count:rows.length};['gross','net','pfEE','pfER','esiEE','esiER','pt','tds','loan','other','ded','ctc','bonus'].forEach(k=>t[k]=rows.reduce((s,r)=>s+N(r[k]),0));return t}
function preview(ym){return activeIn(ym).map(e=>calc(e,ym,(S.inputs[ym]||{})[e.id]))}
function monthData(ym){const r=S.runs[ym];if(r)return{processed:true,rows:r.rows||[],t:r.totals||totals(r.rows||[]),run:r};const rows=preview(ym);return{processed:false,rows,t:totals(rows)}}

/* ============ routing / chrome ============ */
const ROUTES=[['dashboard','Dashboard','dash'],['employees','Employees','people'],['onboarding','Onboarding','clip'],['attendance','Attendance & roster','cal'],['payroll','Run payroll','pay'],['leave','Leave','leaf'],['loans','Loans & advances','loan'],['compliance','Compliance','shield'],['reports','Reports','report'],['settings','Settings','cog']];
function nav(){

 $('#nav').innerHTML=ROUTES.map(([k,l,i],n)=>(n===1?'<div class="grp">People</div>':n===4?'<div class="grp">Payroll</div>':n===7?'<div class="grp">Statutory</div>':'')+

 $('#crumb').innerHTML=`${esc(S.cfg.company.name)} <span aria-hidden="true">/</span> <b>${(ROUTES.find(r=>r[0]===S.route)||ROUTES[0])[1]}</b>`;

 if(!md.processed&&act.length)todo.push(['play','Run payroll for '+MON[TODAY.getMonth()],'Not yet processed','→','#payroll',1]);
 const inc=act.filter(e=>!e.pan||!e.account||!e.ifsc||(e.pf&&!e.uan)).length;

 return `

 <div class="row"><button class="btn" type="button" data-act="obNew" ${ro()}>${ic('clip')}Onboard employee</button><a class="btn primary" href="#payroll">${ic('play')}Run payroll</a></div></div>
 ${act.length?`
 <section class="hero ${md.processed?'done':''}" aria-label="This month's payroll">
  <div><div class="stat ${md.processed?'ok':''}"><span class="dot"></span>${md.processed?'Payroll processed':'Payroll pending'}</div>
  <div class="big num">${lakh(t.net)}</div>
  <div class="muted">${md.processed?'Net paid to':'Estimated net for'} ${t.count} employee${t.count===1?'':'s'} · ${ymLabel(ym)}</div>
  <div class="row small muted" style="gap:18px;margin-top:4px"><span>Gross <b style="color:var(--fg)">${inr(t.gross)}</b></span><span>Cost to company <b style="color:var(--fg)">${inr(t.ctc)}</b></span></div>
  ${md.processed?'':'<div class="small" style="color:var(--mari)">Not yet run. Figures are an estimate from current salary structures and attendance.</div>'}</div>
  <div class="quad"><div><small>Provident fund</small><b>${inr(pfTot)}</b><span>${inr(t.pfEE)} employee + ${inr(t.pfER)} employer</span></div>
  <div><small>ESI</small><b>${esiTot?inr(esiTot):'—'}</b><span>${esiTot?inr(t.esiEE)+' employee + '+inr(t.esiER)+' employer':'No one under the ESI limit'}</span></div>
  <div><small>TDS</small><b>${inr(t.tds)}</b><span>New regime estimate</span></div>
  <div><small>Professional tax</small><b>${t.pt?inr(t.pt):'—'}</b><span>${t.pt?'By work-location state':'Not levied for current locations'}</span></div></div>
 </section>
 <div class="cols"><div class="wide">
  <section class="card"><div class="card-h"><h2>Statutory calendar</h2><small>for ${MON[TODAY.getMonth()]} liabilities</small></div>
  <div class="list">${cal.map(([n,s,amt,d,k])=>`<div><div class="date"><b>${d.d}</b><small>${d.mon}</small></div><div class="grow"><b>${n}</b><span class="small muted">${s}</span></div><div class="right"><b class="num">${inr(amt)}</b><div class="small">${fl[k]?'<span class="chip ok">Paid</span>':`<span class="muted">in ${d.left}d</span>`}</div></div></div>`).join('')}
  <div><div class="date"><b>—</b><small>State</small></div><div class="grow"><b>Professional tax</b><span class="small muted">Due date varies by state</span></div><div class="right"><b class="num">${t.pt?inr(t.pt):'—'}</b><div class="small">${fl.pt?'<span class="chip ok">Paid</span>':''}</div></div></div></div>
  <a class="btn link" href="#compliance" style="margin-top:8px">Open compliance →</a></section>
  <section class="card"><div class="card-h"><h2>Recent payroll runs</h2><a class="btn link small" href="#payroll">All runs</a></div>
  ${runs.length?`<div class="kpis">${runs.map(k=>{const r=S.runs[k];return `<div class="kpi"><small>${ymLabel(k)}</small><b>${lakh(r.totals.net)}</b><div class="small muted">${r.totals.count} employees · ${fmtDate((r.processedAt||'').slice(0,10))}</div></div>`}).join('')}</div>`:'<p class="muted small" style="margin:0">Processed months will show here. Your first run will be '+ymLabel(ym)+'.</p>'}</section>
 </div><div class="narrow">
  <section class="card"><h2>Workforce</h2><div style="display:flex;align-items:baseline;gap:8px;margin:8px 0 12px"><span class="num" style="font-family:var(--f-display);font-size:34px;font-weight:800">${act.length}</span><span class="muted">active</span></div>
  <div style="display:flex;flex-direction:column;gap:10px">${Object.entries(depts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>${esc(k)}</span><span class="num">${n}</span></div><div class="bar"><i style="width:${n/act.length*100}%"></i></div></div>`).join('')}</div></section>
  ${noPan+noUan+noBank+noDocs?`<section class="card warn"><h2>Needs attention</h2><div class="list" style="margin-top:4px">
   ${noDocs?`<div><div class="grow"><b>${noDocs} with documents pending</b><span class="small" style="color:var(--mari)">PAN, Aadhaar, photo or bank proof not uploaded</span></div></div>`:''}
   ${noPan?`<div><div class="grow"><b>${noPan} without PAN</b><span class="small" style="color:var(--mari)">TDS return will reject; 20% TDS applies</span></div></div>`:''}
   ${noUan?`<div><div class="grow"><b>${noUan} on PF without UAN</b><span class="small" style="color:var(--mari)">ECR upload will fail</span></div></div>`:''}
   ${noBank?`<div><div class="grow"><b>${noBank} without bank details</b><span class="small" style="color:var(--mari)">Cannot pay by NEFT</span></div></div>`:''}</div>
   <a class="btn link" href="#employees">Fix in employees →</a></section>`:''}
  <section class="card"><div class="card-h"><h2>To do</h2>${todo.length?`<span class="chip acc">${todo.length}</span>`:''}</div>
  ${todo.length?`<div class="list">${todo.map(([i,a,b,c,h,w])=>`<div><div class="icon ${w?'w':''}">${ic(i)}</div><div class="grow"><a href="${h}" style="color:var(--fg);text-decoration:none"><b>${a}</b></a><span class="small muted">${esc(b)}</span></div><b class="num" style="color:${w?'var(--mari)':'var(--accent)'}">${c}</b></div>`).join('')}</div>`:'<p class="muted small" style="margin:0">All caught up.</p>'}</section>
 </div></div>`:`<section class="card">${empty('Add your first employee','Payroll, attendance and compliance all start from the employee list.',`<button class="btn primary" type="button" data-act="addEmp" ${ro()}>${ic('plus')}Add employee</button>`)}</section>`}`;
};

 <div class="toolbar"><input class="input" id="empQ" type="search" placeholder="Search by name, code, department or location" value="${esc(S.ui.q)}" aria-label="Search employees">

 ${all.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Code</th><th>Name</th><th>Role</th><th>Location</th><th class="n">Gross / mo</th><th class="n">Net (est.)</th><th>PF</th><th>PT</th><th>Status</th><th class="n">Actions</th></tr></thead><tbody>

  <button class="btn sm" type="button" data-act="docs" data-id="${e.id}" title="${pendingDocs(e).length?'Pending: '+pendingDocs(e).map(k=>DOC_TYPES.find(d=>d[0]===k)[1]).join(', '):'All required documents uploaded'}">${ic('file')}${(e.docs||[]).length}${pendingDocs(e).length?` <span class="warn-t">·${pendingDocs(e).length} due</span>`:''}</button>
  ${e.status==='onboarding'?'':`<button class="btn sm" type="button" data-act="slip" data-id="${e.id}" data-ym="${CUR}">Slip</button>
  <button class="btn sm ${e.status==='inactive'?'':'danger'}" type="button" data-act="toggleEmp" data-id="${e.id}" ${ro()}>${e.status==='inactive'?'Reactivate':'Deactivate'}</button>`}</div></td></tr>`}).join('')||`<tr><td colspan="10">${empty('No matches','Try a different name, code or location.')}</td></tr>`}

const attTabs=()=>`<div class="tabs" role="group" aria-label="Attendance sections">${[['grid','Attendance'],['roster','Roster'],['shifts','Shifts']].map(([k,l])=>`<button type="button" data-act="attTab" data-k="${k}" aria-pressed="${S.ui.attTab===k}">${l}</button>`).join('')}</div>`;
VIEWS.attendance=()=>S.ui.attTab==='roster'?rosterView():S.ui.attTab==='shifts'?shiftsView():attGrid();
function attGrid(){
 const ym=S.month,D=daysIn(ym),[y,m]=ym.split('-').map(Number),emps=activeIn(ym),locked=!!S.runs[ym];

 let tot=0;
 return attTabs()+`<div class="head"><div><h1>Attendance</h1><p>Click a day to change it. Unmarked days follow the roster: rostered shifts count as present, rostered offs as week off.</p></div>
 <div class="row"><button class="btn sm" type="button" data-act="month" data-k="-1" aria-label="Previous month">‹</button><b style="min-width:130px;text-align:center">${ymLabel(ym)}</b><button class="btn sm" type="button" data-act="month" data-k="1" aria-label="Next month">›</button>
 <button class="btn" type="button" data-act="clearAtt" ${locked||!S.canEdit?'disabled':''}>Mark all present</button>
 <button class="btn" type="button" data-act="dlAtt">${ic('down')}Export</button></div></div>
 <div class="legend">${Object.entries(CODES).map(([k,v])=>`<span><b class="c-${k}">${k}</b>${v}</span>`).join('')}</div>
 ${locked?`<div class="note">Payroll for ${ymLabel(ym)} is processed, so attendance is locked. Reopen the run on the payroll page to make changes.</div>`:''}
 ${emps.length?`<div class="att-wrap"><table class="att"><thead><tr><th class="who-c">Employee (${emps.length})</th>${days.map(d=>`<th class="${isT(d)?'today':''}">${d}<small>${'SMTWTFS'[new Date(y,m-1,d).getDay()]}</small></th>`).join('')}<th class="sum">Paid · LOP</th></tr></thead><tbody>
 ${emps.map(e=>{const s=attSummary(e,ym);tot+=s.lop;return `<tr><td class="who-c"><b>${esc(e.name)}</b><small>${esc(e.code)} · ${esc(e.dept||'')}</small></td>${days.map(d=>{const c=code(e,ym,d);return `<td><button type="button" class="c c-${c}" data-act="cell" data-id="${e.id}" data-d="${d}" ${c==='NJ'||locked||!S.canEdit?'disabled':''} aria-label="${esc(e.name)}, ${d} ${MON[m-1]}: ${CODES[c]||'Not joined'}">${c==='NJ'?'–':c==='P'?'·':c}</button></td>`}).join('')}
 <td class="sum num"><b>${s.paid}</b> / ${s.D}${s.lop?` <span class="chip bad">${s.lop} LOP</span>`:''}</td></tr>`}).join('')}
 </tbody></table></div><p class="small muted" style="margin:0">Total loss-of-pay days this month: <b>${tot}</b>. Approved leave requests are marked here automatically.</p>`:`<section class="card">${empty('No active employees for '+ymLabel(ym),'Add employees first; attendance starts from their joining date.')}</section>`}`;
};

 <div class="kpis"><div class="kpi"><small>Gross</small><b>${inr(t.gross)}</b></div><div class="kpi ok"><small>PF (employee)</small><b>${inr(t.pfEE)}</b></div><div class="kpi"><small>ESI (employee)</small><b>${inr(t.esiEE)}</b></div><div class="kpi warn"><small>TDS</small><b>${inr(t.tds)}</b></div><div class="kpi bad"><small>LOP days</small><b>${rows.reduce((s,r)=>s+r.lop,0)}</b></div><div class="kpi"><small>Cost to company</small><b>${inr(t.ctc)}</b></div></div>
 <div class="row" style="margin-top:14px">${md.processed?`
  <button class="btn" type="button" data-act="dlReg" data-ym="${ym}">${ic('down')}Payroll register</button><button class="btn" type="button" data-act="dlBank" data-ym="${ym}">${ic('down')}Bank transfer file</button><button class="btn" type="button" data-act="dlEcr" data-ym="${ym}">${ic('down')}PF ECR file</button>
  <span class="grow"></span><button class="btn danger" type="button" data-act="reopen" data-ym="${ym}" ${ro()}>Reopen run</button>`:`
  <button class="btn primary" type="button" data-act="process" data-ym="${ym}" ${ro()}>${ic('play')}Process payroll</button>${warn.length?`<span class="chip warn">Pre-check: ${esc(warn.join(' · '))}</span>`:'<span class="chip ok">Pre-check passed</span>'}`}</div></section>
 <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Employee</th><th class="n">Paid days</th><th class="n">Gross</th><th class="n">Bonus / OT</th><th class="n">PF</th><th class="n">ESI</th><th class="n">PT</th><th class="n">TDS</th><th class="n">Loan EMI</th><th class="n">Other ded.</th><th class="n">Net pay</th><th class="n">Slip</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><small>${esc(r.code)} · ${esc(r.designation)}</small></td><td class="n">${r.paid}/${r.D}${r.lop?`<small style="color:var(--bad)">${r.lop} LOP</small>`:''}</td><td class="n">${inr(r.gross)}</td>
  <td class="n">${md.processed?inr(r.bonus):`<input class="cell" id="b-${r.empId}" type="number" min="0" step="1" value="${r.bonus||''}" placeholder="0" data-inp="bonus" data-id="${r.empId}" aria-label="Bonus for ${esc(r.name)}" ${ro()}>`}</td>
  <td class="n">${r.pfEE?inr(r.pfEE):'—'}</td><td class="n">${r.esiEE?inr(r.esiEE):'—'}</td><td class="n">${r.pt?inr(r.pt):'—'}</td><td class="n">${r.tds?inr(r.tds):'—'}</td><td class="n">${r.loan?inr(r.loan):'—'}</td>

 ${prog.map(e=>{const st=Math.min(4,(e.onboarding&&e.onboarding.step)||1),pd=pendingDocs(e);return `<tr><td><b>${esc(e.name||'Unnamed')}</b><small>${esc(e.code||'')} · started ${fmtDate(((e.onboarding&&e.onboarding.started)||'').slice(0,10))}</small></td><td>${esc(e.designation||'—')}<small>${esc(e.dept||'')}</small></td><td>${fmtDate(e.doj)}</td>

  o[k]=['basic','hra','conv','special'].includes(k)?N(v):(k==='tdsOverride'||k==='ptOverride')?(v===''?'':N(v)):k==='weekOff'?+v:String(v).trim()}

const loadXLSX=()=>xlsxP||(xlsxP=new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('load'));s.onerror=()=>{xlsxP=null;rej(new Error('load'))};document.head.appendChild(s)}));
function headDate(c,fy,fm){
 if(typeof c==='number'){if(c>=1&&c<=31)return new Date(fy,fm,c);if(c>30000&&c<80000){const u=new Date(Date.UTC(1899,11,30)+Math.round(c)*864e5);return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())}return null}
 const s=String(c||'').trim();if(!s)return null;let m;
 if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return new Date(+m[1],+m[2]-1,+m[3]);
 if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)))return new Date(+m[3]<100?2000+ +m[3]:+m[3],+m[2]-1,+m[1]);
 if((m=s.match(/(\d{1,2})[\s\-]*([A-Za-z]{3})[A-Za-z]*[\s\-,]*(\d{4})?/))){const mi=MON.findIndex(x=>x.slice(0,3).toLowerCase()===m[2].toLowerCase());if(mi>=0)return new Date(m[3]?+m[3]:fy,mi,+m[1])}
 if((m=s.match(/^(\d{1,2})$/))&&+m[1]>=1&&+m[1]<=31)return new Date(fy,fm,+m[1]);
 return null;
}
async function parseRosterFile(file){
 const X=await loadXLSX(),wb=X.read(await file.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
 const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}),ref=weekDays()[0],fy=ref.getFullYear(),fm=ref.getMonth();
 const isCodeHead=c=>/^(emp(loyee)?[\s._-]*)?(code|id|no\.?)$/i.test(String(c).trim());
 const hi=rows.findIndex(r=>r.some(isCodeHead));
 if(hi<0)throw new Error('Add a heading row with a "Code" column (the employee code) and one column per date.');
 const head=rows[hi],ci=head.findIndex(isCodeHead),cols=[];
 head.forEach((c,i)=>{if(i===ci||/^(emp(loyee)?\s*)?name$/i.test(String(c).trim()))return;const d=headDate(c,fy,fm);if(d&&!isNaN(d))cols.push([i,d])});
 if(!cols.length)throw new Error('No date columns found. Use dates such as 2026-10-20 or 20/10/2026 as the column headings.');
 const by={};Object.entries(S.emps).forEach(([id,e])=>{if(isAct(e))by[String(e.code).trim().toLowerCase()]={...e,id}});
 const changes=[],unknown=[],bad=[],people=new Set();
 rows.slice(hi+1).forEach(r=>{const code=String(r[ci]??'').trim();if(!code)return;const e=by[code.toLowerCase()];if(!e){unknown.push(code);return}
  cols.forEach(([i,d])=>{const raw=r[i];if(raw===''||raw==null||String(raw).trim()===''||String(raw).trim()==='-')return;const v=parseRosterVal(raw);
   if(v==null){bad.push(`${code}, ${fmtDate(isoD(d))}: “${String(raw).slice(0,30)}”`);return}if(e.doj&&isoD(d)<e.doj)return;changes.push([e,d,v]);people.add(e.id)})});
 const ds=cols.map(c=>c[1]).sort((a,b)=>a-b);
 return{changes,unknown:[...new Set(unknown)],bad,people:people.size,from:ds[0],to:ds[ds.length-1],days:cols.length};
}

function localDB(){
 const P='vetan:',subs=[];
 const load=c=>{try{return JSON.parse(localStorage.getItem(P+c)||'{}')}catch(_){return{}}};
 const save=(c,o)=>{try{localStorage.setItem(P+c,JSON.stringify(o))}catch(_){toast('This browser blocked saving. Check that site storage is allowed.','bad')}};
 const notify=c=>subs.filter(s=>s.c===c).forEach(s=>s.fire());
 window.addEventListener('storage',ev=>{if(ev.key&&ev.key.startsWith(P))notify(ev.key.slice(P.length))});
 const sub=(c,fire)=>{const s={c,fire};subs.push(s);setTimeout(fire,0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
 const docRef=(c,id)=>({
  set:async d=>{const o=load(c);o[id]=JSON.parse(JSON.stringify(d));save(c,o);notify(c)},
  delete:async()=>{const o=load(c);delete o[id];save(c,o);notify(c)},
  onSnapshot:cb=>sub(c,()=>{const o=load(c);cb({exists:id in o,data:()=>o[id]})})});
 return{collection:c=>({onSnapshot:cb=>sub(c,()=>{const o=load(c);cb({docs:Object.entries(o).map(([id,d])=>({id,exists:true,data:()=>d}))})})}),doc:p=>{const[c,id]=p.split('/');return docRef(c,id)}};
}
const localDownloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);return{status:'saved'}}};
function localAssets(){
 const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('vetan-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
 return{upload:async(file,o)=>{const blob=new Blob([file],{type:(o&&o.type)||file.type}),id=uid('f');await tx('readwrite',s=>s.put(blob,id));return{id,url:URL.createObjectURL(blob),sizeBytes:blob.size,contentType:blob.type}},
  get:id=>tx('readonly',s=>s.get(id)),delete:async id=>{await tx('readwrite',s=>s.delete(id));return{deleted:true}}};
}
