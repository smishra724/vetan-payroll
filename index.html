<style>
/* Layout: fixed ledger-green sidebar + scrolling work area; sidebar becomes a drawer under 900px */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EDF2EF; --line:#DAE2DD; --fg:#13201C; --muted:#53635C;
  --side:#0F2B26; --side-2:#163A33; --side-fg:#C5D6CF; --side-dim:#8FA79E; --side-active:#1E4D42;
  --accent:#1B6A55; --accent-hover:#145442; --accent-fg:#FFFFFF; --accent-soft:#E2F0EA;
  --mari:#9A5B00; --mari-bg:#FFF3DC; --mari-line:#F0D29A; --mari-dot:#E39A1B;
  --ok:#17663F; --ok-bg:#E1F3E8; --bad:#AF2318; --bad-bg:#FCE9E7; --info:#22508F; --info-bg:#E6EEF9; --plum:#6B3A8C; --plum-bg:#F1E8F7;

  --duty:#0F7B55; --duty-bg:#E3F4EC; --duty-s:#16A06F;
  --lv:#2156C9; --lv-bg:#E8EFFD; --lv-s:#3B73E6;
  --off:#6347C2; --off-bg:#F0EBFC; --off-s:#8466E0;
  --abs:#BF3A2E; --abs-bg:#FDEBE8; --abs-s:#E1574A;
  --half:#9C5700; --half-bg:#FFF2D9; --half-s:#E8A13A;
  --teal:#0B6E80; --teal-bg:#E0F2F5; --teal-s:#1597AE;
  --rose:#AE2459; --rose-bg:#FCE8F0; --rose-s:#D9467F;
  --on-s:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141E1B; --surface-2:#1A2622; --line:#283631; --fg:#E6EEEA; --muted:#9AADA5;

  --shadow:none; color-scheme:dark;
  --duty:#63D6A4; --duty-bg:#10281E; --duty-s:#2FB57F;
  --lv:#93B4F8; --lv-bg:#132240; --lv-s:#4F82EA;

  --abs:#F5978C; --abs-bg:#341816; --abs-s:#E1574A;

  --on-s:#0B1512;}}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800} h2{font-size:16px;font-weight:700} h3{font-size:14px;font-weight:700}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);padding-block:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:3px;padding:2px 8px}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;color:#fff;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--mari-dot)}
.brand span{font-size:12px;color:var(--side-dim);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#3DD68C;display:inline-block;flex:none}
.dot.off{background:#E39A1B}
.who{display:flex;gap:10px;align-items:center;background:var(--side-2);border-radius:10px;padding:10px 12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--side-active);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.who b{color:#fff;font-size:14px;display:block}
.who small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-dim)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 12px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:700}
.nav a[aria-current="page"] svg{color:var(--mari-dot)}
.nav .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-dim);padding:12px 12px 4px}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--mari-dot);color:#1d1300;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-dim);padding:0 8px}

.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{font-size:13px;color:var(--muted)} .crumb b{color:var(--fg);font-weight:600}
.top .sp{flex:1}
.menu-btn{display:none}
.view{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;display:flex;flex-direction:column;gap:18px}
.conn{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:7px 12px;border-radius:8px;background:var(--ok-bg);color:var(--ok)}
.conn.off{background:var(--mari-bg);color:var(--mari)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);color:var(--accent-fg)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.link{border:none;background:none;padding:0;min-height:0;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card.warn{background:var(--mari-bg);border-color:var(--mari-line)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.card-h small{color:var(--muted);font-size:12px}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cols>.wide{flex:3 1 440px;min-width:0;display:flex;flex-direction:column;gap:18px}
.cols>.narrow{flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--mari)} .kpi.bad b{color:var(--bad)}

.hero{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--mari-line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.hero.done{border-color:var(--line)}
.hero>div{flex:1 1 320px;padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.hero>div+div{border-left:1px solid var(--line)}
.hero .big{font-family:var(--f-display);font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mari)}
.stat.ok{color:var(--ok)} .stat .dot{background:var(--mari-dot)} .stat.ok .dot{background:var(--ok)}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;align-content:center}
.quad small{font-size:12px;color:var(--muted);font-weight:600;display:block}
.quad b{display:block;font-family:var(--f-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.quad span{display:block;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px}

.list>div{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:none}
.date{width:42px;text-align:center;flex:none}
.date b{display:block;font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1}
.date small{font-size:11px;color:var(--muted)}
.grow{flex:1;min-width:0}
.grow b{display:block}
.right{text-align:right}
.icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.icon.w{background:var(--mari-bg);color:var(--mari)}
.icon svg{width:16px;height:16px}

.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:800;background:var(--surface-2)}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl tr.inactive td{opacity:.55}
.tbl input.cell{width:92px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--mari-bg);color:var(--mari)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.plum{background:var(--plum-bg);color:var(--plum)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.input{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface);min-height:40px;width:100%}
.field textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.field .hint{font-size:12px;color:var(--muted)}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fsec{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin:6px 0 -2px;grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .input{width:auto;flex:1 1 220px}
.toolbar select.input{flex:0 1 200px}

.att-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.att{border-collapse:collapse;font-size:12px}
.att th,.att td{border-top:1px solid var(--line);padding:0;text-align:center}
.att th{background:var(--surface-2);font-weight:700;padding:6px 0;min-width:34px;font-size:11px}
.att th small{display:block;font-weight:500;color:var(--muted)}
.att th.today{background:var(--accent);color:var(--accent-fg)} .att th.today small{color:var(--accent-fg)}
.att .who-c{text-align:left;padding:8px 12px;min-width:170px;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.att th.who-c{background:var(--surface-2)}
.att .who-c small{display:block;color:var(--muted)}
.att .sum{padding:6px 12px;text-align:right;white-space:nowrap;min-width:110px}
.att button.c{width:32px;height:30px;margin:2px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:11px;font-weight:700;cursor:pointer}
.att button.c:hover{border-color:var(--accent)}
.att button.c[disabled]{cursor:default}
.c-P{color:var(--ok)} .c-A{background:var(--bad-bg)!important;color:var(--bad)} .c-HD{background:var(--mari-bg)!important;color:var(--mari)}
.c-L{background:var(--info-bg)!important;color:var(--info)} .c-LW{background:var(--plum-bg)!important;color:var(--plum)} .c-WO,.c-NJ{color:var(--muted)} .c-H{background:var(--accent-soft)!important;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend b{display:inline-grid;place-items:center;min-width:26px;height:20px;border-radius:5px;font-size:10.5px;background:var(--surface-2)}

.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:15px}
.note{font-size:12.5px;padding:10px 12px;border-radius:8px;background:var(--info-bg);color:var(--info)}
.note.warn{background:var(--mari-bg);color:var(--mari)}

.modal{position:fixed;inset:0;background:rgba(6,18,15,.55);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.dialog.sm{width:min(460px,100%)}
.dialog header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dialog .body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.dialog .body>*{flex-shrink:0}
.dialog footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);width:36px;height:36px;border-radius:8px}
.x:hover{background:var(--surface-2)}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));right:max(18px,env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}

.slip{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slip .sh{padding:16px 18px;background:var(--surface-2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.slip .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;padding:14px 18px;font-size:13px}
.slip .meta small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.slip .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-top:1px solid var(--line)}
.slip .two>div{padding:12px 18px}
.slip .two>div+div{border-left:1px solid var(--line)}
.slip .ln{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.slip .ln.t{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800}
.slip .net{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:14px 18px;background:var(--accent-soft);font-weight:700}
.slip .net b{font-family:var(--f-display);font-size:20px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rate{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}

 if(ap){if(h<1||h>12)return null;h=h%12+(ap[0]==='p'?12:0)}if(h===24&&mi===0){h=23;mi=59}if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}

}

const attTabs=()=>`<div class="tabs" role="group" aria-label="Attendance sections">${[['grid','Attendance'],['roster','Roster'],['shifts','Shifts']].map(([k,l])=>`<button type="button" data-act="attTab" data-k="${k}" aria-pressed="${S.ui.attTab===k}">${l}</button>`).join('')}</div>`;
VIEWS.attendance=()=>S.ui.attTab==='roster'?rosterView():S.ui.attTab==='shifts'?shiftsView():attGrid();
function attGrid(){
 const ym=S.month,D=daysIn(ym),[y,m]=ym.split('-').map(Number),emps=activeIn(ym),locked=!!S.runs[ym];
 const days=[...Array(D)].map((_,i)=>i+1),isT=d=>ym===CUR&&d===TODAY.getDate();
 let tot=0;
 return attTabs()+`<div class="head"><div><h1>Attendance</h1><p>Click a day to change it. Unmarked days follow the roster: rostered shifts count as present, rostered offs as week off.</p></div>
 <div class="row"><button class="btn sm" type="button" data-act="month" data-k="-1" aria-label="Previous month">‹</button><b style="min-width:130px;text-align:center">${ymLabel(ym)}</b><button class="btn sm" type="button" data-act="month" data-k="1" aria-label="Next month">›</button>
 <button class="btn" type="button" data-act="clearAtt" ${locked||!S.canEdit?'disabled':''}>Mark all present</button>
 <button class="btn" type="button" data-act="dlAtt">${ic('down')}Export</button></div></div>
 <div class="legend">${Object.entries(CODES).map(([k,v])=>`<span><b class="c-${k}">${k}</b>${v}</span>`).join('')}</div>
 ${locked?`<div class="note">Payroll for ${ymLabel(ym)} is processed, so attendance is locked. Reopen the run on the payroll page to make changes.</div>`:''}
 ${bulkBar('att',emps,locked)}${emps.length?`<div class="att-wrap"><table class="att"><thead><tr><th class="who-c"><div class="who-in">${selAllBox('att',emps)}<span>Employee (${emps.length})</span></div></th>${days.map(d=>`<th class="${isT(d)?'today':''}">${d}<small>${'SMTWTFS'[new Date(y,m-1,d).getDay()]}</small></th>`).join('')}<th class="sum">Paid · LOP</th></tr></thead><tbody>
 ${emps.map(e=>{const s=attSummary(e,ym);tot+=s.lop;return `<tr class="${selOf('att')[e.id]?'picked':''}"><td class="who-c"><div class="who-in">${selBox('att',e.id,e.name)}<div><b>${esc(e.name)}</b><small>${esc(e.code)} · ${esc(e.dept||'')}</small></div></div></td>${days.map(d=>{const c=code(e,ym,d);return `<td><button type="button" class="c c-${c}" data-act="cell" data-id="${e.id}" data-d="${d}" ${c==='NJ'||locked||!S.canEdit||!canMod('attendance','edit')?'disabled':''} aria-label="${esc(e.name)}, ${d} ${MON[m-1]}: ${CODES[c]||'Not joined'}">${c==='NJ'?'–':c==='P'?'·':c}</button></td>`}).join('')}
 <td class="sum num"><b>${s.paid}</b> / ${s.D}${s.lop?` <span class="chip bad">${s.lop} LOP</span>`:''}</td></tr>`}).join('')}
 </tbody></table></div><p class="small muted" style="margin:0">Total loss-of-pay days this month: <b>${tot}</b>. Approved leave requests are marked here automatically.</p>`:`<section class="card">${empty('No active employees for '+ymLabel(ym),'Add employees first; attendance starts from their joining date.')}</section>`}`;
};

VIEWS.payroll=()=>{
 const ym=S.month,md=monthData(ym),t=md.t,runs=Object.keys(S.runs).sort().reverse();
 const rows=md.rows;
 const warn=[];if(!md.processed){const e=activeIn(ym);const nb=e.filter(x=>!x.account||!x.ifsc).length,np=e.filter(x=>!x.pan).length,nu=e.filter(x=>x.pf&&!x.uan).length;
  if(nb)warn.push(nb+' without bank details');if(np)warn.push(np+' without PAN');if(nu)warn.push(nu+' on PF without UAN');
  if(ym>CUR)warn.push('this month has not started yet');}
 return `<div class="head"><div><h1>Run payroll</h1><p>Loss of pay comes from attendance, PT from each employee's state, and loan EMIs from approved loans. Add bonus or other deductions before processing.</p></div>
 <div class="row"><button class="btn sm" type="button" data-act="month" data-k="-1" aria-label="Previous month">‹</button><b style="min-width:130px;text-align:center">${ymLabel(ym)}</b><button class="btn sm" type="button" data-act="month" data-k="1" aria-label="Next month">›</button></div></div>
 ${rows.length?`
 <section class="card"><div class="card-h"><div><h2>Payroll · ${ymLabel(ym)}</h2><small>${md.processed?'Processed '+fmtDate((md.run.processedAt||'').slice(0,10))+' · '+t.count+' employees':'Draft · '+t.count+' employees'}</small></div>
 <div class="right"><small class="muted">Total net payout</small><div class="num" style="font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--ok)">${inr(t.net)}</div></div></div>
 <div class="kpis"><div class="kpi"><small>Gross</small><b>${inr(t.gross)}</b></div><div class="kpi ok"><small>PF (employee)</small><b>${inr(t.pfEE)}</b></div><div class="kpi"><small>ESI (employee)</small><b>${inr(t.esiEE)}</b></div><div class="kpi warn"><small>TDS</small><b>${inr(t.tds)}</b></div><div class="kpi bad"><small>LOP days</small><b>${rows.reduce((s,r)=>s+r.lop,0)}</b></div><div class="kpi"><small>Cost to company</small><b>${inr(t.ctc)}</b></div></div>
 <div class="row" style="margin-top:14px">${md.processed?`
  <button class="btn" type="button" data-act="dlReg" data-ym="${ym}">${ic('down')}Payroll register</button><button class="btn" type="button" data-act="dlBank" data-ym="${ym}">${ic('down')}Bank transfer file</button><button class="btn" type="button" data-act="dlEcr" data-ym="${ym}">${ic('down')}PF ECR file</button>
  <span class="grow"></span><button class="btn danger" type="button" data-act="reopen" data-ym="${ym}" ${ro('payroll','approve')}>Reopen run</button>`:`
  <button class="btn primary" type="button" data-act="process" data-ym="${ym}" ${ro('payroll','approve')}>${ic('play')}Process payroll</button>${warn.length?`<span class="chip warn">Pre-check: ${esc(warn.join(' · '))}</span>`:'<span class="chip ok">Pre-check passed</span>'}`}</div></section>
 <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Employee</th><th class="n">Paid days</th><th class="n">Gross</th><th class="n">Bonus / OT</th><th class="n">PF</th><th class="n">ESI</th><th class="n">PT</th><th class="n">TDS</th><th class="n">Loan EMI</th><th class="n">Other ded.</th><th class="n">Net pay</th><th class="n">Slip</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b><small>${esc(r.code)} · ${esc(r.designation)}</small></td><td class="n">${r.paid}/${r.D}${r.lop?`<small style="color:var(--bad)">${r.lop} LOP</small>`:''}</td><td class="n">${inr(r.gross)}</td>
  <td class="n">${md.processed?inr(r.bonus):`<input class="cell" id="b-${r.empId}" type="number" min="0" step="1" value="${r.bonus||''}" placeholder="0" data-inp="bonus" data-id="${r.empId}" aria-label="Bonus for ${esc(r.name)}" ${ro()}>`}</td>
  <td class="n">${r.pfEE?inr(r.pfEE):'—'}</td><td class="n">${r.esiEE?inr(r.esiEE):'—'}</td><td class="n">${r.pt?inr(r.pt):'—'}</td><td class="n">${r.tds?inr(r.tds):'—'}</td><td class="n">${r.loan?inr(r.loan):'—'}</td>
  <td class="n">${md.processed?(r.other?inr(r.other):'—'):`<input class="cell" id="o-${r.empId}" type="number" min="0" step="1" value="${r.other||''}" placeholder="0" data-inp="other" data-id="${r.empId}" aria-label="Other deduction for ${esc(r.name)}" ${ro()}>`}</td>
  <td class="n" style="font-weight:800;color:var(--ok)">${inr(r.net)}</td><td class="n"><button class="btn sm" type="button" data-act="slip" data-id="${r.empId}" data-ym="${ym}">View</button></td></tr>`).join('')}
 </tbody><tfoot><tr><td>Total</td><td></td><td class="n">${inr(t.gross)}</td><td class="n">${inr(t.bonus)}</td><td class="n">${inr(t.pfEE)}</td><td class="n">${inr(t.esiEE)}</td><td class="n">${inr(t.pt)}</td><td class="n">${inr(t.tds)}</td><td class="n">${inr(t.loan)}</td><td class="n">${inr(t.other)}</td><td class="n">${inr(t.net)}</td><td></td></tr></tfoot></table></div>`
 :`<section class="card">${empty('Nobody to pay for '+ymLabel(ym),'Payroll includes active employees who joined on or before the last day of the month.')}</section>`}
 <section class="card"><div class="card-h"><h2>Past runs</h2><small>${runs.length} processed</small></div>
 ${runs.length?`<div class="tbl-wrap" style="border:none"><table class="tbl"><thead><tr><th>Month</th><th class="n">Employees</th><th class="n">Gross</th><th class="n">Net</th><th>Processed</th><th class="n"></th></tr></thead><tbody>${runs.map(k=>{const r=S.runs[k];return `<tr><td><b>${ymLabel(k)}</b></td><td class="n">${r.totals.count}</td><td class="n">${inr(r.totals.gross)}</td><td class="n">${inr(r.totals.net)}</td><td>${fmtDate((r.processedAt||'').slice(0,10))}</td><td class="n"><button class="btn sm" type="button" data-act="goMonth" data-ym="${k}">Open</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted small" style="margin:0">No runs yet.</p>'}</section>`;

VIEWS.leave=()=>{

 </tbody></table></div>`:`<section class="card">${empty('No loans or advances','Record a salary advance or loan and its EMI will be deducted automatically.')}</section>`}`;

VIEWS.compliance=()=>{
 const c=S.cfg,fy=TODAY.getMonth()>=3?TODAY.getFullYear():TODAY.getFullYear()-1;
 const months=[ymShift(CUR,-1),CUR];
 const item=(ym,k,n,day,sub,amt)=>{const nx=ymShift(ym,1),[y,m]=nx.split('-').map(Number),dt=new Date(y,m-1,day),left=Math.ceil((dt-new Date(TODAY.toDateString()))/864e5),done=(S.filings[ym]||{})[k];
  return `<div><div class="date"><b>${day}</b><small>${MON[m-1].slice(0,3)}</small></div><div class="grow"><b>${n}</b><span class="small muted">${sub} · for ${ymLabel(ym)}</span></div><div class="right"><b class="num">${inr(amt)}</b><div class="small">${done?'<span class="chip ok">Paid</span>':left<0?'<span class="chip bad">Overdue '+(-left)+'d</span>':'<span class="muted">in '+left+'d</span>'}</div></div>
  <button class="btn sm" type="button" data-act="filing" data-ym="${ym}" data-k="${k}" ${ro()}>${done?'Undo':'Mark paid'}</button></div>`};
 const q=[['Q1 (Apr–Jun)','31 Jul '+fy],['Q2 (Jul–Sep)','31 Oct '+fy],['Q3 (Oct–Dec)','31 Jan '+(fy+1)],['Q4 (Jan–Mar)','31 May '+(fy+1)]];
 return `<div class="head"><div><h1>Compliance</h1><p>Statutory rates used in every payroll run, and the deposits each month creates. Rates are editable in Settings; confirm them with your CA.</p></div></div>
 <section class="card"><div class="card-h"><h2>Deposits due</h2><small>from processed or estimated payroll</small></div><div class="list">
 ${months.map(ym=>{const t=monthData(ym).t;return item(ym,'tds','TDS deposit','7','Challan ITNS 281',t.tds)+item(ym,'pf','PF remittance','15','ECR upload · EPFO',t.pfEE+t.pfER)+item(ym,'esi','ESI contribution','15','ESIC portal',t.esiEE+t.esiER)}).join('')}
 </div></section>
 <div class="grid">
  <section class="card"><h2>Provident fund</h2><p class="small muted">EPF & MP Act, 1952</p>
   <div class="rate"><span>Employee contribution</span><b>${c.pf.ee}% of basic</b></div><div class="rate"><span>Employer: EPS</span><b>8.33% (max ₹1,250)</b></div><div class="rate"><span>Employer: EPF</span><b>${(c.pf.er-8.33).toFixed(2)}%</b></div><div class="rate"><span>Wage ceiling</span><b>${inr(c.pf.ceiling)} / month</b></div><div class="rate"><span>Due</span><b>15th of next month</b></div></section>
  <section class="card"><h2>ESI</h2><p class="small muted">ESI Act, 1948</p>
   <div class="rate"><span>Employee</span><b>${c.esi.ee}% of gross</b></div><div class="rate"><span>Employer</span><b>${c.esi.er}% of gross</b></div><div class="rate"><span>Applies up to</span><b>${inr(c.esi.limit)} gross / month</b></div><div class="rate"><span>Due</span><b>15th of next month</b></div>
   <p class="small muted" style="margin:8px 0 0">${activeIn(CUR).filter(e=>fixedGross(e)<=c.esi.limit).length} of ${activeIn(CUR).length} employees covered</p></section>
  <section class="card"><h2>TDS on salary</h2><p class="small muted">New regime · FY ${fy}-${String(fy+1).slice(2)}</p>
   ${c.tds.slabs.map((s,i)=>{const from=i?N(c.tds.slabs[i-1][0]):0;return `<div class="rate"><span>${N(s[0])?lakh(from)+' – '+lakh(N(s[0])):'Above '+lakh(from)}</span><b>${s[1]}%</b></div>`}).join('')}
   <p class="small muted" style="margin:8px 0 0">Standard deduction ${inr(c.tds.std)}, rebate up to ${lakh(c.tds.rebate)} taxable, ${c.tds.cess}% cess.</p></section>
  <section class="card"><h2>Professional tax</h2><p class="small muted">Monthly, by work-location state</p>
   ${[...new Set(activeIn(CUR).map(e=>e.state||'Other'))].map(s=>`<div class="rate"><span>${esc(s)}</span><b class="small" style="font-weight:600">${esc((PT_STATES[s]||PT_STATES.Other).note)}</b></div>`).join('')||'<p class="muted small">Add employees to see their states.</p>'}</section>
 </div>
 <section class="card"><div class="card-h"><h2>Quarterly TDS returns (Form 24Q)</h2><small>FY ${fy}-${String(fy+1).slice(2)}</small></div>
 <div class="kpis">${q.map(([a,b])=>`<div class="kpi"><small>${a}</small><b style="font-size:17px">${b}</b></div>`).join('')}</div>
 <p class="small muted" style="margin:10px 0 0">Form 16 to employees by 15 June. Labour Welfare Fund, where your state levies it, is not calculated here.</p></section>`;

VIEWS.reports=()=>{

 <td style="min-width:150px">${(()=>{const sg=STAGE[(e.onboarding||{}).stage];return sg?`<span class="chip ${sg[1]}">${sg[0]}</span><small>${(e.onboarding||{}).stage==='invited'?'Sent '+fmtDate(((e.onboarding.invite||{}).sentAt||'').slice(0,10)):(e.onboarding||{}).stage==='submitted'?'Submitted '+fmtDate(((e.onboarding||{}).submittedAt||'').slice(0,10)):''}</small>`:`<div class="small" style="margin-bottom:4px">Step ${st} of 4 · ${OB_STEPS[st-1]}</div><div class="bar"><i style="width:${(st-1)/4*100}%"></i></div>`})()}</td>
 <td>${pd.length?`<span class="chip warn">${REQ_DOCS.length-pd.length} of ${REQ_DOCS.length} required</span>`:'<span class="chip ok">All required</span>'}</td>
 <td><div class="acts">${(()=>{const sg=(e.onboarding||{}).stage,R=ro('employees');return (sg==='invited'||sg==='changes'?`<button class="btn sm" type="button" data-act="inviteSend" data-id="${e.id}" ${R}>Share link</button>`:'')+(sg==='submitted'||sg==='changes'?`<button class="btn sm primary" type="button" data-act="rvOpen" data-id="${e.id}" ${R}>Review</button>`:'')+(sg==='verified'||sg==='offered'?`<button class="btn sm ${sg==='verified'?'primary':''}" type="button" data-act="apptOpen" data-id="${e.id}" ${R}>${sg==='offered'?'Letter':'Appointment letter'}</button>`:'')+(sg==='verified'||sg==='offered'?`<button class="btn sm" type="button" data-act="rvOpen" data-id="${e.id}" ${R}>Review</button>`:'')})()}<button class="btn sm ${(e.onboarding||{}).stage?'':'primary'}" type="button" data-act="obGo" data-id="${e.id}" data-step="${st}" ${ro('employees')}>${(e.onboarding||{}).stage==='offered'?'Complete':'Continue'}</button><button class="btn sm danger" type="button" data-act="obDiscard" data-id="${e.id}" ${ro()}>Discard</button></div></td></tr>`}).join('')}</tbody></table></div>`
 :empty('No onboarding in progress','Start one for a new joiner. You can save at any step and continue later.',`<button class="btn primary" type="button" data-act="obNew" ${ro('employees')}>Start onboarding</button>`)}</section>
 ${pend.length?`<section class="card"><div class="card-h"><h2>Documents still needed</h2><small>active employees</small></div><div class="list">${pend.map(e=>`<div><div class="icon w">${ic('file')}</div><div class="grow"><b>${esc(e.name)}</b><span class="small muted">${pendingDocs(e).map(docName).join(' · ')}</span></div><button class="btn sm" type="button" data-act="docs" data-id="${e.id}">${can('employees','edit')?'Upload':'View'}</button></div>`).join('')}</div></section>`:''}

const shiftOpts=()=>S.cfg.shifts.map(s=>[s.id,s.name+' ('+fmt12(s.start)+' – '+fmt12(s.end)+')']);
const offOpts=()=>[...WEEKDAYS.map((w,i)=>[i,w]),[-1,'No fixed weekly off']];
function bindSplit(f){
 if(!f.struct)return;const st=S.cfg.structures,upd=()=>{$('#grossOut').textContent=inr(['basic','hra','conv','special'].reduce((s,k)=>s+N(f[k].value),0))};
 const split=()=>{const s=st.find(x=>x.id===f.struct.value),g=N(f.mgross.value);if(!s||!g)return;const b=Math.round(g*s.basic/100),h=Math.round(b*s.hra/100),cv=Math.min(N(s.conv),Math.max(0,g-b-h));f.basic.value=b;f.hra.value=h;f.conv.value=cv;f.special.value=Math.max(0,g-b-h-cv);upd()};
 f.struct.addEventListener('change',split);f.mgross.addEventListener('input',split);['basic','hra','conv','special'].forEach(k=>f[k].addEventListener('input',upd));
}
function wizard(id,step){
 step=+step||1;const isNew=!id,e=id?(S.emps[id]||{}):{pf:true,state:S.cfg.company.state,doj:TODAY.toISOString().slice(0,10),weekOff:0,shift:S.cfg.defaultShift,empType:'Permanent'};

  ${fld('dob','Date of birth',e.dob,{type:'date'})}${fld('gender','Gender',e.gender,{sel:['','Female','Male','Other']})}${fld('father',"Father's or spouse's name",e.father)}${fld('marital','Marital status',e.marital,{sel:['','Single','Married','Other']})}
  ${fld('aadhaar','Aadhaar number',e.aadhaar,{max:14,ph:'XXXX XXXX XXXX'})}${fld('blood','Blood group',e.blood,{sel:['','A+','A−','B+','B−','AB+','AB−','O+','O−']})}${fld('address','Current address',e.address,{full:1})}
  ${fld('emName','Emergency contact name',e.emName)}${fld('emPhone','Emergency contact phone',e.emPhone,{type:'tel'})}</div>`;
 if(step===2)b+=`<div class="fgrid">${fld('designation','Designation',e.designation,{req:1})}${fld('dept','Department',e.dept,{req:1})}${fld('doj','Date of joining',e.doj,{type:'date',req:1})}${fld('empType','Employment type',e.empType,{sel:['Permanent','Probation','Contract','Intern']})}

  ${editing?fld('status','Status',e.status||'active',{sel:[['active','Active'],['inactive','Inactive']]}):''}

 if(step===3)b+=`<div class="fgrid"><div class="check"><input type="checkbox" id="pf" name="pf" ${e.pf?'checked':''}><label for="pf">Deduct PF</label></div>
  ${fld('uan','UAN',e.uan,{max:12,hint:'Leave blank for a first job; add once EPFO allots it'})}${fld('pan','PAN',e.pan,{max:10,ph:'ABCDE1234F'})}

function obCollect(f){
 const d=Object.fromEntries(new FormData(f)),o={};
 for(const[k,v]of Object.entries(d)){if(k==='struct'||k==='mgross'||k==='pf')continue;
  o[k]=['basic','hra','conv','special'].includes(k)?N(v):(k==='tdsOverride'||k==='ptOverride')?(v===''?'':N(v)):k==='weekOff'?+v:String(v).trim()}
 if(f.querySelector('#pf'))o.pf=!!d.pf;if(o.pan)o.pan=o.pan.toUpperCase();if(o.ifsc)o.ifsc=o.ifsc.toUpperCase();return o;
}
function obValidate(o,id,step){
 if(step===1){if(!o.code||!o.name)return 'Fill in the employee code and full name.';if(!/^\d{10}$/.test((o.phone||'').replace(/\D/g,'').slice(-10))||!o.phone)return 'Enter a 10-digit mobile number.';
  if(Object.entries(S.emps).some(([k,x])=>k!==id&&String(x.code).toLowerCase()===o.code.toLowerCase()))return 'Another employee already uses code '+o.code+'.';
  if(o.aadhaar&&o.aadhaar.replace(/\s/g,'').length!==12)return 'Aadhaar should be 12 digits.'}
 if(step===2){if(!o.designation||!o.dept||!o.doj)return 'Fill in designation, department and date of joining.';if(o.basic+o.hra+o.conv+o.special<=0)return 'Enter the salary, or pick a structure and a monthly gross.'}
 if(step===3){if(o.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(o.pan))return 'PAN should look like ABCDE1234F.';if(o.ifsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(o.ifsc))return 'IFSC should be 11 characters, like HDFC0001234.'}
 return '';
}
function obStore(o,id,step){
 const now=new Date().toISOString(),nid=id||uid('e'),base=id?S.emps[id]:{status:'onboarding',docs:[],onboarding:{started:now},pf:true,state:S.cfg.company.state,doj:TODAY.toISOString().slice(0,10),weekOff:0,shift:S.cfg.defaultShift,empType:'Permanent'};
 const rec={...base,...o,updated:now};
 if(rec.status==='onboarding')rec.onboarding={...(base.onboarding||{}),step:Math.max(step,(base.onboarding&&base.onboarding.step)||1)};

function obSubmit(f,id,step){

 if(e.status==='onboarding'){const miss=[];if(!e.code||!e.name)miss.push('personal details');if(!e.doj||fixedGross(e)<=0)miss.push('job & salary');
  if(miss.length){mErr('Complete '+miss.join(' and ')+' before finishing.');return false}
  put('employees',nid,{...e,status:'active',onboarding:{...e.onboarding,step:4,completed:new Date().toISOString()}});
  const pd=pendingDocs(e).length;toast(e.name+' is onboarded'+(pd?'; '+pd+' document'+(pd===1?'':'s')+' still pending':''))}
 else toast('Saved '+e.name);
 return true;

function headDate(c,fy,fm){
 if(typeof c==='number'){if(c>=1&&c<=31)return new Date(fy,fm,c);if(c>30000&&c<80000){const u=new Date(Date.UTC(1899,11,30)+Math.round(c)*864e5);return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())}return null}
 const s=String(c||'').trim();if(!s)return null;let m;
 if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return new Date(+m[1],+m[2]-1,+m[3]);
 if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)))return new Date(+m[3]<100?2000+ +m[3]:+m[3],+m[2]-1,+m[1]);
 if((m=s.match(/(\d{1,2})[\s\-]*([A-Za-z]{3})[A-Za-z]*[\s\-,]*(\d{4})?/))){const mi=MON.findIndex(x=>x.slice(0,3).toLowerCase()===m[2].toLowerCase());if(mi>=0)return new Date(m[3]?+m[3]:fy,mi,+m[1])}
 if((m=s.match(/^(\d{1,2})$/))&&+m[1]>=1&&+m[1]<=31)return new Date(fy,fm,+m[1]);
 return null;
}
async function parseRosterFile(file){
 const X=await loadXLSX(),wb=X.read(await file.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
 const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}),ref=weekDays()[0],fy=ref.getFullYear(),fm=ref.getMonth();
 const isCodeHead=c=>/^(emp(loyee)?[\s._-]*)?(code|id|no\.?)$/i.test(String(c).trim());
 const hi=rows.findIndex(r=>r.some(isCodeHead));
 if(hi<0)throw new Error('Add a heading row with a "Code" column (the employee code) and one column per date.');
 const head=rows[hi],ci=head.findIndex(isCodeHead),cols=[];
 head.forEach((c,i)=>{if(i===ci||/^(emp(loyee)?\s*)?name$/i.test(String(c).trim()))return;const d=headDate(c,fy,fm);if(d&&!isNaN(d))cols.push([i,d])});
 if(!cols.length)throw new Error('No date columns found. Use dates such as 2026-10-20 or 20/10/2026 as the column headings.');
 const by={};Object.entries(S.emps).forEach(([id,e])=>{if(isAct(e))by[String(e.code).trim().toLowerCase()]={...e,id}});
 const changes=[],unknown=[],bad=[],people=new Set();
 rows.slice(hi+1).forEach(r=>{const code=String(r[ci]??'').trim();if(!code)return;const e=by[code.toLowerCase()];if(!e){unknown.push(code);return}
  cols.forEach(([i,d])=>{const raw=r[i];if(raw===''||raw==null||String(raw).trim()===''||String(raw).trim()==='-')return;const v=parseRosterVal(raw);
   if(v==null){bad.push(`${code}, ${fmtDate(isoD(d))}: “${String(raw).slice(0,30)}”`);return}if(e.doj&&isoD(d)<e.doj)return;changes.push([e,d,v]);people.add(e.id)})});
 const ds=cols.map(c=>c[1]).sort((a,b)=>a-b);
 return{changes,unknown:[...new Set(unknown)],bad,people:people.size,from:ds[0],to:ds[ds.length-1],days:cols.length};
}

function importForm(){
 const head='code,name,email,phone,dob,doj,designation,department,state,basic,hra,conveyance,special,pf,uan,pan,bank,account,ifsc';
 modal('Import employees',`<p class="small muted" style="margin:0">Paste rows or choose a CSV file. Required columns: <b>code, name, doj</b> and either <b>basic</b> (with hra, conveyance, special) or <b>gross</b>. Dates as YYYY-MM-DD; pf as Y or N. Existing codes are updated.</p>
 <div class="row"><input type="file" id="csvFile" accept=".csv,text/csv" aria-label="Choose CSV file"><button class="btn sm" type="button" data-act="tplCsv">${ic('down')}Template</button></div>
 <div class="field"><label for="csvText">CSV rows (with header)</label><textarea id="csvText" name="csv" placeholder="${head}"></textarea></div>`,{sm:'Import',submit:f=>{
  const lines=f.csv.value.trim().split(/\r?\n/).filter(Boolean);if(lines.length<2)return mErr('Add a header row and at least one employee row.');
  const parse=l=>{const o=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q}else if(ch===','&&!q){o.push(cur);cur=''}else cur+=ch}o.push(cur);return o.map(s=>s.trim())};
  const h=parse(lines[0]).map(x=>x.toLowerCase());const ix=k=>h.indexOf(k);
  if(ix('code')<0||ix('name')<0)return mErr('The header needs at least code and name columns.');
  let n=0,bad=[];const byCode={};Object.entries(S.emps).forEach(([k,e])=>byCode[String(e.code).toLowerCase()]=k);
  lines.slice(1).forEach((l,i)=>{const r=parse(l),g=k=>ix(k)>=0?r[ix(k)]||'':'';if(!g('code')||!g('name')){bad.push(i+2);return}
   let basic=N(g('basic')),hra=N(g('hra')),conv=N(g('conveyance')||g('conv')),special=N(g('special'));
   if(!basic&&N(g('gross'))){const s=S.cfg.structures[0],gr=N(g('gross'));basic=Math.round(gr*s.basic/100);hra=Math.round(basic*s.hra/100);conv=Math.min(N(s.conv),gr-basic-hra);special=gr-basic-hra-conv}
   const st=STATES.find(s=>s.toLowerCase()===g('state').toLowerCase())||S.cfg.company.state;
   const id=byCode[g('code').toLowerCase()]||uid('e');
   put('employees',id,{...(S.emps[id]||{status:'active'}),code:g('code'),name:g('name'),email:g('email'),phone:g('phone'),dob:g('dob'),doj:g('doj')||TODAY.toISOString().slice(0,10),designation:g('designation'),dept:g('department')||g('dept'),state:st,basic,hra,conv,special,pf:!/^n/i.test(g('pf')),uan:g('uan'),pan:g('pan').toUpperCase(),bankName:g('bank'),account:g('account'),ifsc:g('ifsc').toUpperCase(),tdsOverride:'',ptOverride:'',updated:new Date().toISOString()});n++});
  toast(`Imported ${n} employee${n===1?'':'s'}`+(bad.length?`; skipped rows ${bad.join(', ')}`:''));return true}});
 $('#csvFile').addEventListener('change',ev=>{const fl=ev.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{$('#csvText').value=rd.result};rd.readAsText(fl)});
}

function localDB(){
 const P='vetan:',subs=[];
 const load=c=>{try{return JSON.parse(localStorage.getItem(P+c)||'{}')}catch(_){return{}}};
 const save=(c,o)=>{try{localStorage.setItem(P+c,JSON.stringify(o))}catch(_){toast('This browser blocked saving. Check that site storage is allowed.','bad')}};
 const notify=c=>subs.filter(s=>s.c===c).forEach(s=>s.fire());
 window.addEventListener('storage',ev=>{if(ev.key&&ev.key.startsWith(P))notify(ev.key.slice(P.length))});
 const sub=(c,fire)=>{const s={c,fire};subs.push(s);setTimeout(fire,0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
 const docRef=(c,id)=>({
  set:async d=>{const o=load(c);o[id]=JSON.parse(JSON.stringify(d));save(c,o);notify(c)},
  delete:async()=>{const o=load(c);delete o[id];save(c,o);notify(c)},
  onSnapshot:cb=>sub(c,()=>{const o=load(c);cb({exists:id in o,data:()=>o[id]})})});
 return{collection:c=>({onSnapshot:cb=>sub(c,()=>{const o=load(c);cb({docs:Object.entries(o).map(([id,d])=>({id,exists:true,data:()=>d}))})})}),doc:p=>{const[c,id]=p.split('/');return docRef(c,id)}};
}

 const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
 return{upload:async(file,o)=>{const blob=new Blob([file],{type:(o&&o.type)||file.type}),id=uid('f');await tx('readwrite',s=>s.put(blob,id));return{id,url:URL.createObjectURL(blob),sizeBytes:blob.size,contentType:blob.type}},
  get:id=>tx('readonly',s=>s.get(id)),delete:async id=>{await tx('readwrite',s=>s.delete(id));return{deleted:true}}};

const escXml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const phKey=k=>String(k).replace(/\s+/g,'').toLowerCase();
function fillDocxXml(xml,vals){
 const V={};Object.entries(vals).forEach(([k,v])=>V[phKey(k)]=v);
 const re=/(<w:t(?:\s[^>]*)?>)([^<]*)(<\/w:t>)/g,nodes=[];let m;
 while((m=re.exec(xml)))nodes.push({start:m.index,len:m[0].length,open:m[1],text:m[2],close:m[3]});
 let full='';const offs=nodes.map(n=>{const o=full.length;full+=n.text;return o});
 const T=nodes.map(n=>n.text),found=new Set(),missing=new Set();
 const at=p=>{let lo=0,hi=nodes.length-1,r=-1;while(lo<=hi){const mid=(lo+hi)>>1;if(offs[mid]<=p){r=mid;lo=mid+1}else hi=mid-1}while(r>0&&offs[r]>p)r--;while(r<nodes.length-1&&p>=offs[r]+nodes[r].text.length)r++;return r};
 const ph=/&lt;&lt;\s*([^&<>]+?)\s*&gt;&gt;/g,eds=[];
 while((m=ph.exec(full)))eds.push({s:m.index,e:m.index+m[0].length,key:m[1]});
 for(const ed of eds.reverse()){const k=phKey(ed.key);if(!(k in V)){missing.add(ed.key);continue}found.add(ed.key);
  const v=escXml(V[k]),si=at(ed.s),ei=at(ed.e-1),so=ed.s-offs[si],eo=ed.e-offs[ei];
  if(si===ei)T[si]=T[si].slice(0,so)+v+T[si].slice(eo);
  else{T[si]=T[si].slice(0,so)+v;for(let i=si+1;i<ei;i++)T[i]='';T[ei]=T[ei].slice(eo)}}
 let out=xml;for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];if(T[i]===n.text)continue;let op=n.open;if(!/xml:space/.test(op))op=op.replace('<w:t','<w:t xml:space="preserve"');out=out.slice(0,n.start)+op+T[i]+n.close+out.slice(n.start+n.len)}
 return{xml:out,found:[...found],missing:[...missing]};
}
function docxPlaceholders(xml){const t=[...xml.matchAll(/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g)].map(x=>x[1]).join('');return [...new Set([...t.matchAll(/&lt;&lt;\s*([^&<>]+?)\s*&gt;&gt;/g)].map(x=>x[1]))]}

async function alMake(d){const e=S.emps[d.id],f=$('#mForm');if(!e||!f)return;const t=tplRec();if(!t)return mErr('Upload the template first.');
 const v=n=>String(f.elements[n].value||'').trim(),nf=x=>Math.round(N(x)).toLocaleString('en-IN');
 if(!v('alName')||!v('alDesig')||!v('alDoj'))return mErr('Fill in the name, designation and date of joining.');
 const b=N(v('alBasic')),h=N(v('alHra')),o=N(v('alOther')),g=b+h+o;
 const vals={DocumentDate:longDate(v('alDate')),EmployeeName:v('alName'),EmployeeAddress1:v('alA1'),EmployeeAddress2:v('alA2'),EmployeeAddress3:v('alA3'),EmployeeEmail:v('alEmail'),Designation:v('alDesig'),JoiningDate:longDate(v('alDoj')),
  DirectorName:v('alSign'),DirectorTitle:v('alTitle'),BasicMonthly:nf(b),BasicAnnual:nf(b*12),HRAMonthly:nf(h),HRAAnnual:nf(h*12),OtherMonthly:nf(o),OtherAnnual:nf(o*12),GrossMonthly:nf(g),GrossAnnual:nf(g*12),
  EmployeeCode:e.code||'',Department:e.dept||'',CompanyName:S.cfg.company.name||''};
 const btn=document.querySelector('[data-act=alMake]');if(btn)btn.disabled=true;
 try{const Z=await loadZip(),zip=await Z.loadAsync(fromB64(t.b64,DOCX_CT));let miss=new Set();
  for(const name of Object.keys(zip.files).filter(n=>/^word\/(document|header\d*|footer\d*)\.xml$/.test(n))){const r=fillDocxXml(await zip.file(name).async('string'),vals);r.missing.forEach(m=>miss.add(m));zip.file(name,r.xml)}
  const out=await zip.generateAsync({type:'blob',mimeType:DOCX_CT}),fn=`Appointment-letter-${v('alName').replace(/[^A-Za-z0-9]+/g,'-')}.docx`;
  const c=clone(S.cfg);c.company={...c.company,signName:v('alSign'),signTitle:v('alTitle')};put('config','main',c);
  const ob=e.onboarding||{};put('employees',d.id,{...e,designation:v('alDesig'),doj:v('alDoj'),onboarding:{...ob,stage:ob.stage==='submitted'||ob.stage==='changes'||ob.stage==='invited'||ob.stage==='verified'||!ob.stage?'offered':ob.stage,offer:{date:v('alDate'),at:new Date().toISOString(),gross:g}}});
  S._letter={file:new File([out],fn,{type:DOCX_CT}),id:d.id};await download(fn,out);
  const em=e.email,msg=`Dear ${v('alName')},\n\nPlease find attached your appointment letter for the role of ${v('alDesig')} at ${S.cfg.company.name}, effective ${longDate(v('alDoj'))}. Kindly sign and return a copy.\n\nRegards,\n${v('alSign')||S.cfg.company.name}`;
  modal('Letter ready',`<p style="margin:0"><b>${esc(fn)}</b> is downloaded${miss.size?`. These template fields had no value: ${esc([...miss].join(', '))}`:''}.</p>
  <p class="small muted" style="margin:0">Send it to ${esc(v('alName'))}: share the file directly, or open an email or WhatsApp message and attach the downloaded file.</p>
  <div class="row"><button class="btn primary" type="button" data-act="alShare">Share file</button><a class="btn" target="_blank" rel="noopener" href="mailto:${encodeURIComponent(em||'')}?subject=${encodeURIComponent('Appointment letter · '+S.cfg.company.name)}&body=${encodeURIComponent(msg)}">Email</a>${e.phone?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/91${e.phone}?text=${encodeURIComponent(msg)}">WhatsApp</a>`:''}<button class="btn" type="button" data-act="alAgain" data-id="${d.id}">Download again</button></div>
  ${e.status==='onboarding'?`<p class="small" style="margin:0">When they join, finish onboarding to add them to payroll.</p>`:''}`,{foot:`${e.status==='onboarding'?`<button class="btn" type="button" data-act="obGo" data-id="${d.id}" data-step="2">Open onboarding</button>`:''}<button class="btn primary" type="button" data-act="close">Done</button>`});
 }catch(err){if(btn)btn.disabled=false;mErr(err&&err.message==='load'?'Could not load the Word file tools. Check your internet connection and try again.':'Could not create the letter. Check the template is a .docx file. '+((err&&err.message)||''))}
}
function tplPick(){const i=document.createElement('input');i.type='file';i.accept='.docx,'+DOCX_CT;i.style.display='none';document.body.appendChild(i);
 i.onchange=async()=>{const f=i.files[0];i.remove();if(!f)return;if(!/\.docx$/i.test(f.name))return toast('Choose a Word .docx file.','bad');if(f.size>3*1024*1024)return toast('The template should be under 3 MB.','bad');
  try{const Z=await loadZip(),zip=await Z.loadAsync(f),x=zip.file('word/document.xml');if(!x)throw new Error('not a Word document');const ph=docxPlaceholders(await x.async('string'));
   put('templates','appt',{name:f.name,size:f.size,b64:await toB64(f),fields:ph,at:new Date().toISOString()});toast(`Template saved with ${ph.length} field${ph.length===1?'':'s'}`);
   const m=document.querySelector('[data-act=alMake]');if(m){apptLetter(m.dataset.id)}}
  catch(e){toast(e&&e.message==='load'?'Could not load the Word file tools. Check your internet connection.':'Could not read that template: '+((e&&e.message)||''),'bad')}};i.click()}

 inviteNew:()=>inviteForm(),inviteSend:d=>inviteShare(d.id),subImport:()=>subImportForm(),rvOpen:d=>reviewCand(d.id),rvDoc,rvChanges,rvVerify,apptOpen:d=>apptLetter(d.id),alMake,tplPick,

 jDel:d=>{const J=S.jn;if(!J||!J.docs[d.k])return;J.docs[d.k].splice(+d.i,1);refreshJDocs()},
 jSubmit:()=>joinSubmit(),jShare:()=>joinShare(),jDl:()=>joinDl(),jEdit:()=>{S.jn.done=null;S._lgKey=null;render()}

(async()=>{
 const inClaude=!!(window.claude&&window.claude.use);
 const use=n=>inClaude?window.claude.use(n).catch(()=>null):Promise.resolve(null);
 let[db,dl,user,assets]=await Promise.all([use('db'),use('downloads'),use('user'),use('assets')]);
 S.vision=false;use('sample').then(sp=>{S.sample=sp;if(sp)sp.limits().then(l=>{S.vision=!!(l&&l.images)}).catch(()=>{})});
 if(!inClaude){S.local=true;db=localDB();dl=localDownloads;try{assets=window.indexedDB?localAssets():null}catch(_){assets=null}}
 S.dl=dl;S.assets=assets;S.loaded.tried=true;
 if(user){try{S.canEdit=await user.canEdit()}catch(_){}}
 if(!db){$('#connLabel').innerHTML='<span class="dot off"></span>Offline preview';render();return}
 S.db=db;let pending=9;const ready=()=>{if(--pending===0){S.live=true;$('#connLabel').innerHTML=S.local?'<span class="dot"></span>Saved in this browser':'<span class="dot"></span>Saved to your data';}render()};
 const once=f=>{let d=false;return(...a)=>{f(...a);if(!d){d=true;ready()}}};
 const err=e=>{if(e&&e.code==='revoked'){S.live=false;S.canEdit=false;render()}};
 [['employees','emps'],['attendance','att'],['runs','runs'],['leaves','leaves'],['loans','loans'],['filings','filings'],['roster','roster'],['templates','tpls']].forEach(([c,k])=>db.collection(c).onSnapshot(once(q=>{const o={};q.docs.forEach(x=>o[x.id]=x.data());S[k]=o;render()}),err));
 db.doc('config/main').onSnapshot(once(s=>{S.cfg=mergeCfg(s.exists?s.data():null);render()}),err);
})();
